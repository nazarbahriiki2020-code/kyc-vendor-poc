[project]
name = "kyc-vendor-poc"
version = "0.1.0"
description = "Proof-of-concept comparing identity-verification vendors (Didit, Veriff) through one interface"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["httpx>=0.27", "fastapi>=0.110", "uvicorn>=0.29", "python-dotenv>=1.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "respx>=0.21"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning", "ignore:.*httpx2.*"]
